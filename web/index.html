<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TI-CREATE</title>
<style>
:root{--bg:#e3e6ec;--ink:#1c2029;--mute:#5d6575;--body:#262a33;--key:#3a4050;--lcd:#dde6f1;--blue:#2457d6;--blue-d:#1b43a8;--ok:#1f7a4d;--err:#b3261e;--line:#c5cad5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Helvetica Neue",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px 64px}
main{width:100%;max-width:680px}
h1{font-size:2.4rem;line-height:1;margin:0 0 6px;font-weight:800;letter-spacing:-.03em}
.sub{margin:0 0 24px;color:var(--mute);max-width:46ch}
.seg{display:inline-flex;background:#d2d6df;border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:8px 20px;border-radius:8px;color:var(--mute);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.calc{background:var(--body);border-radius:22px 22px 34px 34px;padding:18px 18px 22px;box-shadow:0 14px 30px -12px rgba(20,24,34,.55)}
.lcd{position:relative;aspect-ratio:4/3;border-radius:6px;background:var(--lcd);overflow:hidden;display:grid;place-items:center;cursor:pointer;
 box-shadow:inset 0 0 0 3px #12151b,inset 0 2px 10px rgba(0,0,0,.25);outline-offset:4px}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(rgba(255,255,255,.0) 50%,rgba(20,40,80,.05) 50%) 0 0/100% 3px}
.lcd:focus-visible{outline:3px solid #8fb0ff}
.lcd.over{background:#cddcf5}
.lcd .hint{text-align:center;color:#34425c;padding:16px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.95rem;line-height:1.6}
.lcd .hint b{display:block;font-size:1.25rem;margin-bottom:4px}
.lcd img,.lcd video{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#000}
.count{position:absolute;right:8px;bottom:8px;z-index:2;background:#12151b;color:#fff;border-radius:4px;padding:2px 8px;font:600 .8rem ui-monospace,Menlo,monospace}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px}
label{display:block;color:#c9cfdb;font-size:.85rem;font-weight:600}
select,input[type=number],input[type=text]{width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:0;background:var(--key);color:#fff;font:inherit;font-weight:500}
select:focus-visible,input:focus-visible{outline:2px solid #8fb0ff}
.help{display:block;font-weight:400;color:#9aa3b5;font-size:.78rem;margin-top:3px}
details{margin-top:14px;color:#c9cfdb}summary{cursor:pointer;font-size:.85rem;font-weight:600}
details .opts{margin-top:10px}
.go{margin-top:20px;width:100%;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:1.05rem;font-family:inherit;padding:14px;cursor:pointer;transition:background .15s}
.go:hover{background:var(--blue-d)}.go:disabled{background:#4a5164;color:#98a0b2;cursor:not-allowed}
.go:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
.bar{height:6px;border-radius:3px;background:#12151b;margin-top:12px;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:#8fb0ff;transition:width .2s}
.status{min-height:1.4em;margin-top:12px;font-size:.92rem}.status.err{color:var(--err);font-weight:600}
.results{margin-top:20px;background:#fff;border-radius:14px;padding:6px 18px;display:none}
.results h2{font-size:1rem;margin:12px 0 4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row a{color:var(--blue);font-weight:600;text-decoration:none;word-break:break-all}.row a:hover{text-decoration:underline}
.row span{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.all{display:inline-block;margin:6px 0 14px;font-weight:700;color:var(--ok);text-decoration:none}.all:hover{text-decoration:underline}
.note{color:var(--mute);font-size:.85rem;margin:2px 0 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>TI-CREATE</h1>
  <p class="sub">Turn pictures and video into files your TI-84 CE can display.</p>

  <div class="seg" role="group" aria-label="What are you converting?">
    <button id="m-image" aria-pressed="true">Images</button>
    <button id="m-video" aria-pressed="false">Video</button>
    <button id="m-hd" aria-pressed="false">HD picture</button>
    <button id="m-yaml" aria-pressed="false">convimg</button>
  </div>

  <div class="calc">
    <div class="lcd" id="lcd" tabindex="0" role="button" aria-label="Choose files">
      <div class="hint" id="hint"><b>Drop images here</b>or click to choose</div>
      <input id="file" type="file" hidden>
    </div>

    <div class="opts" id="o-image">
      <label>Format
        <select id="format">
          <optgroup label="Color, 16-bit">
            <option value="rgb16" selected>Full size</option><option value="rgb16_32k">Max 32 KB</option><option value="rgb16_16k">Max 16 KB</option><option value="rgb16_8k">Max 8 KB</option><option value="rgb16_4k">Max 4 KB</option><option value="rgb16_2k">Max 2 KB</option>
          </optgroup>
          <optgroup label="Color, 8-bit">
            <option value="rgb8">Full size</option><option value="rgb8_32k">Max 32 KB</option><option value="rgb8_16k">Max 16 KB</option><option value="rgb8_8k">Max 8 KB</option><option value="rgb8_4k">Max 4 KB</option><option value="rgb8_2k">Max 2 KB</option>
          </optgroup>
          <optgroup label="Other"><option value="1bpp">Black and white</option><option value="txt">C source text</option></optgroup>
        </select>
        <span class="help">Smaller files use more compression.</span>
      </label>
    </div>

    <div class="opts" id="o-hd" hidden>
      <label>Picture ID<input id="pid" type="text" maxlength="2" value="A1" autocapitalize="characters"><span class="help">A capital letter, then a letter or digit. Extra pictures get the next IDs.</span></label>
      <label>Size
        <select id="resize"><option value="0">Keep original size</option><option value="1" selected>Fit inside 320x240</option><option value="2">Exactly 320x240</option></select>
        <span class="help">The calculator screen is 320x240.</span>
      </label>
    </div>

    <div id="o-video" hidden>
      <div class="opts">
        <label>Video name<input id="vname" type="text" maxlength="6" value="VIDEO"><span class="help">Up to 6 letters or digits.</span></label>
        <label>Frames per second<input id="fps" type="number" min="1" max="30" value="10"><span class="help">Higher is smoother but larger.</span></label>
      </div>
      <details><summary>Compression</summary>
        <div class="opts">
          <label>Frame difference<input id="maxdif" type="number" min="0" max="255" value="80"><span class="help">Higher drops more detail.</span></label>
          <label>Run-length level<input id="rle" type="number" min="1" max="50" value="10"><span class="help">Keep at 10 unless a file is too big.</span></label>
        </div>
      </details>
    </div>

    <button class="go" id="go" disabled>Convert</button>
    <div class="bar" id="bar"><i id="fill"></i></div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="results" id="results" aria-label="Converted files">
    <h2>Your files</h2>
    <a class="all" id="zip" href="#">Download all as a zip</a>
    <div id="list"></div>
    <p class="note">Send the .8xv files to your calculator with TI Connect CE. Send every file, including the index.</p>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
let mode='image', files=[], job=null;

function setMode(m){
  mode=m; files=[]; job=null;
  for(const k of ['image','video','hd','yaml']) $('m-'+k).setAttribute('aria-pressed',m===k);
  $('o-image').hidden=m!=='image'; $('o-video').hidden=m!=='video'; $('o-hd').hidden=m!=='hd';
  const f=$('file'); f.value=''; f.multiple=m!=='video'; f.accept=m==='video'?'video/*':(m==='yaml'?'':'image/*');
  $('results').style.display='none'; $('status').textContent=''; $('status').className='status';
  render();
}
function render(){
  const lcd=$('lcd'); lcd.querySelectorAll('img,video,.count').forEach(e=>e.remove());
  $('hint').style.display=files.length?'none':'';
  const H={image:'<b>Drop images here</b>or click to choose',hd:'<b>Drop pictures here</b>for the HD Picture Viewer',video:'<b>Drop a video here</b>or click to choose',yaml:'<b>Drop a convimg .yaml</b>plus the images it uses'};
  $('hint').innerHTML=H[mode];
  if(mode==='yaml'&&files.length){
    $('hint').style.display=''; $('hint').innerHTML='<b>'+files.length+(files.length===1?' file':' files')+' ready</b>'+files.map(f=>f.name.replace(/[<>&]/g,'')).slice(0,6).join('<br>')+(files.length>6?'<br>\u2026':'');
  } else if(files.length){
    const url=URL.createObjectURL(files[0]);
    const el=document.createElement(mode==='image'?'img':'video'); el.src=url;
    if(mode==='video'){el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true}
    lcd.insertBefore(el,$('file'));
    const c=document.createElement('div'); c.className='count';
    c.textContent=mode==='video'?files[0].name:files.length+(files.length===1?' image':' images'); lcd.appendChild(c);
  }
  $('go').disabled=!files.length;
}
function pick(list){
  const arr=[...list].filter(f=>mode==='yaml'||f.type.startsWith(mode==='video'?'video/':'image/'));
  if(!arr.length){say('That isn\u2019t '+(mode==='video'?'a video':'an image')+'. Choose '+(mode==='video'?'an MP4, MOV, or similar file.':'PNG, JPG, or BMP files.'),true);return}
  files=mode==='video'?[arr[0]]:arr; render(); say('');
}
function say(t,err){const s=$('status');s.textContent=t;s.className='status'+(err?' err':'')}
function progress(p){$('bar').style.display=p==null?'none':'block';$('fill').style.width=(p||0)+'%'}

const lcd=$('lcd');
lcd.addEventListener('click',()=>$('file').click());
lcd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
$('file').addEventListener('click',e=>e.stopPropagation());
$('file').addEventListener('change',e=>pick(e.target.files));
['dragenter','dragover'].forEach(t=>lcd.addEventListener(t,e=>{e.preventDefault();lcd.classList.add('over')}));
['dragleave','drop'].forEach(t=>lcd.addEventListener(t,e=>{e.preventDefault();lcd.classList.remove('over')}));
lcd.addEventListener('drop',e=>pick(e.dataTransfer.files));
for(const k of ['image','video','hd','yaml']) $('m-'+k).onclick=()=>setMode(k);

function upload(file,jobId){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('POST','/upload?name='+encodeURIComponent(file.name)+(jobId?'&job='+jobId:''));
    x.onload=()=>x.status===200?res(JSON.parse(x.responseText)):rej(new Error('Upload failed.'));
    x.onerror=()=>rej(new Error('Lost connection to the TI-CREATE server.'));
    x.send(file);
  });
}

$('go').onclick=async()=>{
  $('go').disabled=true; $('results').style.display='none'; say('Uploading\u2026'); progress(0);
  try{
    job=null;
    for(let i=0;i<files.length;i++){ const r=await upload(files[i],job); job=r.job; progress((i+1)/files.length*40); }
    say(mode==='video'?'Converting video. This can take a minute\u2026':'Converting\u2026'); progress(60);
    const body={job,mode,id:$('pid').value.toUpperCase(),resize:+$('resize').value,format:$('format').value,name:$('vname').value||'VIDEO',fps:+$('fps').value||10,maxdif:+$('maxdif').value,rle:+$('rle').value};
    const r=await fetch('/convert',{method:'POST',body:JSON.stringify(body)});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Conversion failed.');
    progress(100); say('Done. '+d.files.length+(d.files.length===1?' file':' files')+' ready.');
    $('list').innerHTML=d.files.map(f=>`<div class="row"><a href="${f.url}">${f.name}</a><span>${(f.size/1024).toFixed(1)} KB</span></div>`).join('');
    $('zip').href='/zip/'+d.job; $('zip').style.display=d.files.length>1?'inline-block':'none';
    $('results').style.display='block';
  }catch(e){ say(e.message,true); }
  finally{ setTimeout(()=>progress(null),600); $('go').disabled=!files.length; }
};
setMode('image');
</script>
</body>
</html>
